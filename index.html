<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=play_circle" />
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="score" aria-live="polite">pontos: <span class="score--value">00</span></div>

    <div class="game">
        <div class="menu-screen">
            <span class="game-over">fim de jogo</span>
            <span class="final-score">pontos <span>00</span></span>

            <button class="btn-play" type="button">
                <span class="material-symbols-outlined" aria-hidden="true">play_circle</span>
                Jogar novamente
            </button>
        </div>
        <canvas width="600" height="600"></canvas>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
